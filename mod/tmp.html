<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-field="t">Mod Template</title>

  <style>
    :root {
      --bg-color: #0a0a0a;
      --card-bg: #121212;
      --accent-color: #ffde00;
      --text-main: #e0e0e0;
      --text-muted: #a0a0a0;
      --border-color: #222;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .ad-banner {
      width: 100%;
      background: #121212;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 20px 0;
      border-radius: 8px;
      padding: 10px;
      overflow: hidden;
      min-height: 60px;
    }

    .mod-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .mod-title {
      font-size: 1.5rem;
      color: var(--accent-color);
      margin-bottom: 10px;
    }

    .mod-meta {
      display: flex;
      gap: 15px;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      flex-wrap: wrap;
    }

    .poster-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .poster-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .categories {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .badge {
      background: #222;
      color: var(--accent-color);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      border: 1px solid #333;
    }

    .mod-description {
      font-size: 1.05rem;
      margin-bottom: 25px;
      white-space: pre-line;
    }

    .video-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      margin: 20px 0;
      border-radius: 8px;
      overflow: hidden;
    }
    .video-box iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .screenshots-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin: 20px 0;
    }
    .screenshots-grid img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    /* ===== الأزرار: بدون hover وبدون transform ===== */
    .btn-download {
      display: block;
      width: 100%;
      text-align: center;
      padding: 16px;
      background: var(--accent-color);
      color: #000;
      font-weight: bold;
      font-size: 1.2rem;
      text-decoration: none;
      border-radius: 8px;
      margin-top: 20px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }
    .btn-download:active {
      background: #e6c800;
    }

    .extra-buttons {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .btn-extra {
      flex: 1;
      min-width: 200px;
      text-align: center;
      padding: 12px;
      background: #1e1e1e;
      color: var(--accent-color);
      border: 1px solid #333;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      border-radius: 8px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }
    .btn-extra:active {
      background: #252525;
      border-color: var(--accent-color);
    }
    /* ================================================ */

    .related-section {
      margin-top: 40px;
    }
    .related-title {
      font-size: 1.4rem;
      color: var(--accent-color);
      margin-bottom: 15px;
      border-left: 4px solid var(--accent-color);
      padding-left: 10px;
    }
    .related-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }
    .related-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
    }
    .related-img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
    }
    .related-info {
      padding: 12px;
    }
    .related-card-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--text-main);
      margin-bottom: 5px;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      padding: 20px 0;
      color: var(--text-muted);
      font-size: 0.9rem;
      border-top: 1px solid var(--border-color);
    }
  </style>
</head>
