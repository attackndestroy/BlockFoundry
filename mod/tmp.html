  <style>
    * {

      margin: 0;

    body {
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: Arial, sans-serif;
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    .ad-banner {
      width: 100%;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 20px 0;
      overflow: hidden;
    }

    .mod-card {
      background: #121212;
      padding: 20px;
    }

    .mod-title {
      font-size: 1.5rem;
      color: #ffde00;
      margin-bottom: 10px;
    }

    .mod-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      font-size: 0.85rem;
      color: #a0a0a0;
      margin-bottom: 20px;
    }

    .poster-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      margin-bottom: 20px;
    }

    .poster-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .badge {
      color: #ffde00;
      font-size: 0.8rem;
    }

    .mod-description {
      margin-bottom: 25px;
      white-space: pre-line;
    }

    .video-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      margin: 20px 0;
    }

    .video-box iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .screenshots-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin: 20px 0;
    }

    .screenshots-grid img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
    }

    .btn-download {
      display: block;
      width: 100%;
      padding: 16px;
      margin-top: 20px;
      background: #ffde00;
      color: #000;
      text-align: center;
      font-weight: bold;
      font-size: 1.2rem;
      text-decoration: none;
      cursor: pointer;
    }

    .extra-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    .btn-extra {
      flex: 1;
      min-width: 200px;
      padding: 12px;
      background: #1e1e1e;
      color: #ffde00;
      text-align: center;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }

    .related-section {
      margin-top: 40px;
    }

    .related-title {
      font-size: 1.4rem;
      color: #ffde00;
      margin-bottom: 15px;
    }

    .related-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }

    .related-card {
      display: block;
      background: #121212;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
    }

    .related-img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
    }

    .related-info {
      padding: 12px;
    }

    .related-card-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: #e0e0e0;
      margin-bottom: 5px;
    }

    footer {
      text-align: center;

      padding: 20px 0;
      color: #a0a0a0;

  </style>
