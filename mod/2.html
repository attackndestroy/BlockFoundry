<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading Mod...</title>
</head>
<body style="background: #0a0a0a; color: white;">

  <div id="app" style="text-align:center; margin-top:50px; font-size: 1.2rem;">Loading content...</div>

  <script>
    async function initPage() {
      const path = window.location.pathname;
      const fileName = path.substring(path.lastIndexOf('/') + 1);
      const modId = parseInt(fileName.replace(/\.html$/i, '')) || 1;

      try {
        const [templateRes, dataRes] = await Promise.all([
          fetch('tmp.html'),
          fetch('data.json')
        ]);

        if (!templateRes.ok || !dataRes.ok) {
          throw new Error('Failed to fetch template or data');
        }

        const templateText = await templateRes.text();
        const dataList = await dataRes.json();

        const item = dataList.find(m => m.n === modId);

        if (!item) {
          document.body.innerHTML = "<h2 style='text-align:center; margin-top:50px;'>Mod Not Found (404)</h2>";
          return;
        }

        const parser = new DOMParser();
        const doc = parser.parseFromString(templateText, 'text/html');

        doc.querySelectorAll('[data-field="t"]').forEach(el => el.textContent = item.t);
        doc.querySelector('[data-field="a"]').textContent = item.a;
        doc.querySelector('[data-field="v"]').textContent = item.v;
        doc.querySelector('[data-field="h"]').textContent = item.h;
        doc.querySelector('[data-field="d"]').textContent = item.d;
        doc.querySelector('[data-field="p"]').src = item.p;
        doc.querySelector('[data-field="l"]').href = item.l;

        const catBox = doc.querySelector('[data-field="c"]');
        catBox.innerHTML = '';
        if (Array.isArray(item.c)) {
          item.c.forEach(cat => {
            const span = doc.createElement('span');
            span.className = 'badge';
            span.textContent = cat;
            catBox.appendChild(span);
          });
        }

        const screenBox = doc.querySelector('[data-field="s"]');
        screenBox.innerHTML = '';
        if (Array.isArray(item.s) && item.s.length > 0) {
          item.s.forEach(imgUrl => {
            const img = doc.createElement('img');
            img.src = imgUrl;
            img.alt = 'Screenshot';
            screenBox.appendChild(img);
          });
        } else {
          screenBox.style.display = 'none';
          const screenTitle = screenBox.previousElementSibling;
          if (screenTitle && screenTitle.tagName === 'H3') screenTitle.style.display = 'none';
        }

        if (item.y) {
          const videoBox = doc.querySelector('[data-field="youtube-box"]');
          const iframe = doc.querySelector('[data-field="youtube"]');
          iframe.src = `https://www.youtube.com/embed/${item.y}`;
          if (videoBox) videoBox.style.display = 'block';
        }

        const relatedBox = doc.querySelector('[data-field="related-mods"]');
        if (relatedBox) {
          relatedBox.innerHTML = '';
          const otherMods = dataList.filter(m => m.n !== modId).slice(0, 3);

          if (otherMods.length === 0) {
            const section = relatedBox.closest('.related-section');
            if (section) section.style.display = 'none';
          }

          otherMods.forEach(mod => {
            const card = doc.createElement('a');
            card.className = 'related-card';
            card.href = `${mod.n}.html`;

            const img = doc.createElement('img');
            img.className = 'related-img';
            img.src = mod.p;
            img.alt = mod.t;

            const info = doc.createElement('div');
            info.className = 'related-info';

            const cardTitle = doc.createElement('div');
            cardTitle.className = 'related-card-title';
            cardTitle.textContent = mod.t;

            const ver = doc.createElement('div');
            ver.style.fontSize = '0.8rem';
            ver.style.color = '#a0a0a0';
            ver.textContent = `Version: ${mod.v}`;

            info.appendChild(cardTitle);
            info.appendChild(ver);
            card.appendChild(img);
            card.appendChild(info);
            relatedBox.appendChild(card);
          });
        }

        document.open();
        document.write('<!DOCTYPE html>\n' + doc.documentElement.outerHTML);
        document.close();

      } catch (err) {
        console.error("Error loading mod content:", err);
        
        let errorMsg = "";
        
        if (err.message.includes("Failed to fetch") || err.message.includes("NetworkError")) {
          errorMsg = "Network/CORS Error: The browser blocked loading 'tmp.html' or 'data.json'. If you are opening this from your device (file://), please use a web server or GitHub Pages instead.";
        } else if (err.name === "SyntaxError") {
          errorMsg = "JSON Error: The file 'data.json' has invalid syntax. Check for missing commas, quotes, or empty values.";
        } else if (err.message.includes("Cannot set properties of null") || err.message.includes("Cannot read properties of null")) {
          errorMsg = "Template Error: An element with a specific 'data-field' was not found in 'tmp.html'. Please check your template file.";
        } else if (err.message.includes("Failed to fetch template or data")) {
          errorMsg = "404 Error: Could not find 'tmp.html' or 'data.json'. Make sure both files are in the same folder and their names are correct.";
        } else {
          errorMsg = "Error details: " + err.message;
        }

        document.body.innerHTML = `
          <div style="text-align:center; margin-top:50px; padding: 20px; font-family: sans-serif;">
            <h2 style="color: #ff4444;">Error Loading Mod</h2>
            <p style="color: #ffde00; font-size: 1.1rem; max-width: 600px; margin: 20px auto; line-height: 1.6;">${errorMsg}</p>
            <div style="color: #a0a0a0; font-size: 0.85rem;">Check the console for more details.</div>
          </div>
        `;
      }
    }

    initPage();
  </script>

</body>
</html>
